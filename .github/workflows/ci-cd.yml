name: ML Multi-Disease CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers
        run: |
          docker compose up -d
          for i in {1..10}; do
            curl http://localhost:5000/ && break
            echo "Waiting for backend..."
            sleep 5
          done

      - name: Test Backend Health
        run: curl http://localhost:5000/

      - name: Test Diabetes Prediction
        run: |
          curl -X POST http://localhost:5000/predict/diabetes \
          -H "Content-Type: application/json" \
          -d "{\"features\": [1,2,3,4,5,6,7,8]}"

      - name: Test Heart Prediction
        run: |
          curl -X POST http://localhost:5000/predict/heart \
          -H "Content-Type: application/json" \
          -d "{\"features\": [50,1,2,120,200]}"

      - name: Test Kidney Prediction
        run: |
          curl -X POST http://localhost:5000/predict/kidney \
          -H "Content-Type: application/json" \
          -d "{\"features\": [50,80,1.0,12.0]}"

      - name: Cleanup
        if: always()
        run: docker compose down